site_name: mol-platform
site_description: Containerized microservice for molecular generation and analysis with RDKit
site_author: coccinella-labs
site_url: https://coccinella-labs.github.io/molplatform

repo_name: coccinella-labs/molplatform
repo_url: https://github.com/coccinella-labs/molplatform

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - API Authentication: api-auth.md
      - Quick Start: quickstart.md
      - Configuration: configuration.md
  - Usage:
      - Command Line Interface: cli.md
  - API Documentation:
      - Overview: api/overview.md
      - Endpoints: api/endpoints.md
  - Development:
      - Contributing: contributing.md
      - Testing: testing.md
      - CI/CD: cicd.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/coccinella-labs/molplatform
