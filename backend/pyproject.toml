[project]
name = "mol-platform"
version = "1.0.0"
license = "MIT"
description = "Containerized microservice for molecular generation and mutation analysis"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
     "rdkit==2025.9.3",
    "numpy",
    "Pillow",
    "celery==5.6.3",
    "redis==5.0.1",
    "passlib==1.7.4",
    "python-multipart==0.0.32",
    "email-validator==2.1.1",
    "sentry-sdk==2.72.0",
    "pytest==9.1.1",
    "httpx==0.25.2",
    "python-dotenv==1.2.3",
     "requests==2.33.0",
]

[project.scripts]
mol-platform = "cli:main"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # Line too long, handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
