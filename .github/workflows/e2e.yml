name: E2E Tests

on:
  push:
    branches: [ main, 1.0.0 ]
  pull_request:
    branches: [ main, 1.0.0 ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install Docker Compose
      run: |
        curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose

    - name: Create .env file
      run: echo "API_KEY=${{ secrets.API_KEY }}" > .env

    - name: Build Docker images
      run: docker-compose build

    - name: Start services
      run: |
        docker-compose up -d
        docker ps
        docker exec molplatform_frontend_1 ls -la /usr/share/nginx/html || echo 'html dir not found'
        docker logs molplatform_backend_1
        docker logs molplatform_frontend_1
        # Wait for backend to be ready
        timeout 60 bash -c 'until curl -f -H "Authorization: Bearer ${{ secrets.API_KEY }}" http://localhost:8000/health; do sleep 2; done'
        # Wait for frontend to be ready
        timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        # cypress 15.16.0 declares node "^20.1.0 || ^22.0.0 || >=24.0.0".
        # Node 18 is outside that, and its bundled tsx throws on the removed
        # --loader flag, so the run dies before any spec executes. Node 20 also
        # reached end of life in April 2026, so 22 is the lowest target that
        # both satisfies the constraint and is still supported.
        node-version: '22'

    - name: Clean node_modules
      run: rm -rf frontend/node_modules

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Cypress e2e tests
      run: |
        cd frontend
        npm run cypress:run -- --record false
      env:
        CYPRESS_BASE_URL: http://localhost:3000

    - name: Stop services
      run: docker compose down
